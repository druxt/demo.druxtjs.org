# Toolchain for the whole repository: one `mise install` provides both.
# Node matches .nvmrc (kept for nvm users) and is what Nuxt 2's webpack 4
# build runs on. PHP matches drupal/composer.lock, which is Drupal 11.
[tools]
node = "16.20.2"
php = "8.5.10"

[tasks.setup]
description = "Install dependencies, provision Drupal (SQLite, Tome content), start the backend."
run = "npm run setup"

[tasks.dev]
description = "Run the Nuxt dev server against the local backend (port 3000)."
run = "npm run dev"

[tasks.generate]
description = "Generate the static site into nuxt/dist against the local backend."
run = "npm run generate"

[tasks.start]
description = "Start the local Drupal backend."
run = "npm run start"

[tasks.stop]
description = "Stop the local Drupal backend."
run = "npm run stop"

[tasks.test]
description = "Unit tests with the coverage floor enforced."
run = "npm test"

[tasks.lint]
description = "Every linter except prose."
run = "npm run lint"
