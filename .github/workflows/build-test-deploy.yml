name: build-test-deploy

on:
  push:
    branches:
      - main
      - develop
  # Every pull request, whatever it targets. A branch filter here skipped
  # stacked pull requests entirely, so a change based on another open branch
  # got no build, no link check and no deploy preview until its base merged.
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [16]

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4
        with:
          # Pull request builds run repository-controlled commands. Without
          # this the checkout token stays readable to all of them.
          persist-credentials: false

      - name: Setup node env 🏗
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: nuxt/package-lock.json

      - name: Setup ddev
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
      - name: Start ddev
        run: cd drupal && ddev start

      - name: Install Drupal 👨🏻‍💻
        run: cd drupal && ddev drupal-install

      - name: Install Nuxt.js 👨🏻‍💻
        run: cd nuxt && npm ci

      - name: Run linting 🔎
        run: cd nuxt && npm run lint

      # @TODO - Add unit tests
      # - name: Run unit tests 🧪
      #   run: cd nuxt && npm run test:unit

      - name: Build dist 👨🏻‍💻
        run: cd nuxt && npm run generate
        env:
          # Only main sends hits to the real GA4 property. Deploy previews and
          # branch builds generate without the gtag snippet at all.
          ANALYTICS_ENABLED: ${{ github.ref == 'refs/heads/main' }}

      # @TODO - Add e2e tests
      # - name: Run end-to-end tests 🧪
      #   run: cd nuxt && NODE_TLS_REJECT_UNAUTHORIZED=0 npm run test:cy

      # The demo list is Tome content in drupal/content, so the generated site
      # carries the real outbound links. This site advertised a storybook that
      # returned 502 for two years without anyone noticing.
      - name: Check links 🔗
        uses: lycheeverse/lychee-action@v2
        with:
          # Settings live in .lychee.toml so a local run and this job agree.
          args: >-
            --config .lychee.toml
            --root-dir ${{ github.workspace }}/nuxt/dist
            'nuxt/dist/**/*.html'
          fail: true
          jobSummary: true

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v1.2
        with:
          publish-dir: './nuxt/dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'chore(ci): deploy from GitHub Actions'
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
          github-deployment-environment: ${{ github.head_ref }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1

      # - uses: actions/upload-artifact@v3
