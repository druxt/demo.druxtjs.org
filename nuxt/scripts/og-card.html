<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
      }

      body {
        background: #1c2733;
        color: #e5ecf1;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
          'Helvetica Neue', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
        position: relative;
        overflow: hidden;
      }

      .glow {
        position: absolute;
        inset: auto -140px -220px auto;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgb(65 184 131 / 18%),
          transparent 62%
        );
      }

      .top {
        display: flex;
        align-items: center;
        gap: 18px;
        position: relative;
      }

      .top svg {
        width: 56px;
      }

      .top span {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .eyebrow {
        margin-top: auto;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #37cdbe;
        position: relative;
      }

      h1 {
        margin: 14px 0 20px;
        font-size: 76px;
        font-weight: 700;
        line-height: 1.04;
        letter-spacing: -0.025em;
        position: relative;
      }

      h1 i {
        font-style: normal;
        color: #41b883;
      }

      p {
        font-size: 25px;
        line-height: 1.45;
        color: #9db2c2;
        max-width: 30ch;
        position: relative;
      }

      .foot {
        display: flex;
        align-items: center;
        gap: 14px;
        position: relative;
      }

      .chip {
        border: 1px solid #33465a;
        background: #1a2531;
        border-radius: 999px;
        padding: 9px 20px;
        font-size: 19px;
        font-weight: 600;
        color: #e5ecf1;
      }

      .url {
        margin-left: auto;
        font: 600 21px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #53b0eb;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="top">
      <svg viewBox="0 0 452 342" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M139 330l-1-2c-2-4-2-8-1-13H29L189 31l67 121 22-16-67-121c-1-2-9-14-22-14-6 0-15 2-22 15L5 303c-1 3-8 16-2 27 4 6 10 12 24 12h136c-14 0-21-6-24-12z"
          fill="#3498DB"
        />
        <path
          d="M447 304L317 70c-2-2-9-15-22-15-6 0-15 3-22 15l-17 28v54l39-67 129 230h-49a23 23 0 0 1-2 14l-1 1c-6 11-21 12-23 12h76c3 0 17-1 24-12 3-5 5-14-2-26z"
          fill="#108775"
        />
        <path
          d="M376 330v-1l1-2c1-4 2-8 1-12l-4-12-102-178-15-27h-1l-15 27-102 178-4 12a24 24 0 0 0 2 15c4 6 10 12 24 12h190c3 0 18-1 25-12zM256 152l93 163H163l93-163z"
          fill="#E5ECF1"
        />
      </svg>
      <span>DruxtJS</span>
    </div>
    <div>
      <p class="eyebrow">Live demos</p>
      <h1>Real Drupal sites,<br />decoupled with <i>Druxt</i></h1>
      <p>
        A Drupal backend serving JSON:API, a Nuxt frontend rendering it, every
        one open source.
      </p>
    </div>
    <div class="foot">
      <span class="chip">Umami food magazine</span
      ><span class="chip">Documentation site</span>
      <span class="url">demo.druxtjs.org</span>
    </div>
  </body>
</html>
